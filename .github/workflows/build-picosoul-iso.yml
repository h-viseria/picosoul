# Build PicoSoul live ISO and publish to GitHub Releases.
# Repo: https://github.com/h-viseria/picosoul
#
# Does NOT run on every push (ISO builds are heavy).
# Run manually: Actions → "Build PicoSoul ISO" → Run workflow
# Or push a tag: git tag iso-0.1.0 && git push origin iso-0.1.0
name: Build PicoSoul ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "iso-*"

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap squashfs-tools xorriso \
            isolinux syslinux-common rsync dpkg-dev \
            apt-utils wget ca-certificates cpio gzip tar \
            debian-archive-keyring
          # debootstrap expects .gpg; some hosts only ship .pgp — normalize
          if [[ ! -f /usr/share/keyrings/debian-archive-keyring.gpg ]]; then
            if [[ -f /usr/share/keyrings/debian-archive-keyring.pgp ]]; then
              sudo ln -sf /usr/share/keyrings/debian-archive-keyring.pgp \
                /usr/share/keyrings/debian-archive-keyring.gpg
            else
              # Pull Debian's keyring package if Ubuntu's is incomplete
              KR="$(wget -qO- https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/ \
                | grep -oE 'debian-archive-keyring_[0-9][^\"<> ]+_all\.deb' \
                | sort -u | tail -1)"
              wget -q "https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/${KR}" \
                -O "/tmp/${KR}"
              sudo dpkg -i "/tmp/${KR}" || sudo apt-get install -fy
            fi
          fi
          ls -la /usr/share/keyrings/debian-archive-keyring.* || true
          # Ubuntu's live-build still uses obsolete "bookworm/updates" security
          # paths. Install Debian live-build (all.deb) so Bookworm uses
          # security.debian.org/debian-security + bookworm-security.
          sudo apt-get remove -y live-build || true
          LB_VER="$(wget -qO- https://deb.debian.org/debian/pool/main/l/live-build/ \
            | grep -oE 'live-build_[0-9][^\"<> ]+_all\.deb' \
            | sort -u | tail -1)"
          echo "Using Debian package: ${LB_VER}"
          wget -q "https://deb.debian.org/debian/pool/main/l/live-build/${LB_VER}" \
            -O "/tmp/${LB_VER}"
          sudo dpkg -i "/tmp/${LB_VER}" || sudo apt-get install -fy
          lb --version || true

      - name: Build ISO
        run: |
          # Windows sync can leave CRLF. Package lists with \r make apt
          # look up "live-boot\r" → Unable to locate package.
          find scripts/distro distro/live-build -type f \( \
              -name '*.sh' -o -name 'config' -o -name '*.hook.*' \
              -o -name '*.list*' -o -name '*.chroot' -o -name 'README' \
              -o -name '*.conf' -o -name '*.toml' -o -name '*.txt' \
            \) -exec sed -i 's/\r$//' {} +
          # Prove package list is LF before build
          if grep -q $'\r' distro/live-build/config/package-lists/*.list* 2>/dev/null; then
            echo "ERROR: CRLF still present in package-lists after strip"
            od -c distro/live-build/config/package-lists/picosoul.list.chroot | head
            exit 1
          fi
          echo "package-lists LF check OK"
          chmod +x scripts/distro/build_iso.sh distro/live-build/auto/config
          find distro/live-build/config/hooks -type f -exec chmod +x {} \;
          # Run as root (sudo -E is ignored on these runners)
          sudo ./scripts/distro/build_iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: picosoul-iso
          path: |
            out/iso/*.iso
            out/iso/*.sha256
          if-no-files-found: error
          retention-days: 14

      # Stable URL: .../releases/latest/download/picosoul-amd64.iso
      - name: Stage stable ISO names
        run: |
          set -euo pipefail
          ISO="$(ls out/iso/picosoul-*-amd64.iso | head -1)"
          test -f "$ISO"
          HASH="$(sha256sum "$ISO" | awk '{print $1}')"
          cp -f "$ISO" out/iso/picosoul-amd64.iso
          printf '%s  picosoul-amd64.iso\n' "$HASH" > out/iso/picosoul-amd64.iso.sha256
          {
            echo "PicoSoul live ISO (Debian Bookworm hybrid)."
            echo
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Source file: $(basename "$ISO")"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Stable assets (replaced each build):"
            echo "* picosoul-amd64.iso"
            echo "* picosoul-amd64.iso.sha256"
          } > out/iso/RELEASE_NOTES.md

      - name: Replace previous iso-latest assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view iso-latest >/dev/null 2>&1; then
            gh release delete-asset iso-latest picosoul-amd64.iso --yes || true
            gh release delete-asset iso-latest picosoul-amd64.iso.sha256 --yes || true
          fi

      - name: Publish iso-latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-latest
          name: PicoSoul ISO (latest)
          body_path: out/iso/RELEASE_NOTES.md
          files: |
            out/iso/picosoul-amd64.iso
            out/iso/picosoul-amd64.iso.sha256
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned GitHub Release (iso-* tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/iso/picosoul-*-amd64.iso
            out/iso/picosoul-*-amd64.iso.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
